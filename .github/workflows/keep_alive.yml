name: 24/7 Render Service Keep-Alive Heartbeat

on:
  schedule:
    # Runs every 10 minutes to keep the Render free-tier instance active
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping CareerPulse AI API Gateway & DB Health Check
        run: |
          echo "Sending keep-alive heartbeat to Render service & database pool..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://careerpulse-ai-9q9s.onrender.com/api/health)
          echo "Render Service API /api/health status code: $STATUS_CODE"
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "✅ Service and database pool are WARM and healthy."
          else
            echo "⚠️ Warning: Received HTTP $STATUS_CODE. Performing fallback heartbeat to root API..."
            FALLBACK_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://careerpulse-ai-9q9s.onrender.com/api)
            echo "Fallback status code: $FALLBACK_CODE"
          fi
